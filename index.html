<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SILVAFFZ - Sua Key</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(circle at top, #101c32, #050811 65%);
  color: white;
  font-family: Arial, sans-serif;
}

.panel {
  width: 100%;
  max-width: 400px;
  padding: 25px;
  text-align: center;
  background: #070d19;
  border: 1px solid #00eaff;
  border-radius: 18px;
  box-shadow: 0 0 25px #00eaff44;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #00eaff;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.subtitle {
  color: #66849b;
  font-size: 12px;
  margin-bottom: 25px;
}

.key-box {
  padding: 20px;
  background: #0d1725;
  border: 1px solid #00ff88;
  border-radius: 12px;
}

.title {
  color: #00ff88;
  font-size: 13px;
  font-weight: bold;
}

#key {
  margin: 18px 0;
  padding: 14px;
  background: #050811;
  border-radius: 8px;
  color: #00ff88;
  font-size: 18px;
  font-weight: bold;
  word-break: break-all;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #00ff88;
  color: #001a0d;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#status {
  margin-top: 15px;
  color: #00ff88;
  font-size: 12px;
  min-height: 18px;
}
</style>
</head>

<body>

<div class="panel">

  <div class="logo">
    SILVAFFZ
  </div>

  <div class="subtitle">
    SUA KEY DE ACESSO
  </div>

  <div class="key-box">

    <div class="title">
      🔑 SUA KEY
    </div>

    <div id="key">
      CARREGANDO...
    </div>

    <button id="copyButton">
      📋 COPIAR KEY
    </button>

    <div id="status"></div>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDC7qRhqJJHV4Mybb8DpxMY_Ieud52DeoA",

  authDomain:
  "silvaffz.firebaseapp.com",

  projectId:
  "silvaffz",

  storageBucket:
  "silvaffz.firebasestorage.app",

  messagingSenderId:
  "120628808949",

  appId:
  "1:120628808949:web:745ef77eedbc9550a509bc",

  measurementId:
  "G-D1NJ15L6Q8"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   GERAR KEY
========================= */

function gerarKey() {

  const parte1 =
  Math.random()
  .toString(36)
  .substring(2, 6)
  .toUpperCase();

  const parte2 =
  Math.random()
  .toString(36)
  .substring(2, 6)
  .toUpperCase();

  return "SILVA-" +
         parte1 +
         "-" +
         parte2;
}


/* =========================
   CRIAR KEY
========================= */

async function criarKey() {

  const key =
  gerarKey();

  const agora =
  new Date();

  const expiracao =
  new Date(agora);

  expiracao.setDate(
    expiracao.getDate() + 30
  );


  try {

    await addDoc(

      collection(
        db,
        "Keys"
      ),

      {

        Key: key,

        Active: true,

        createdAt:
        Timestamp.fromDate(
          agora
        ),

        expiresAt:
        Timestamp.fromDate(
          expiracao
        )

      }

    );


    document
    .getElementById("key")
    .innerText =
    key;


  } catch (error) {

    console.error(error);

    document
    .getElementById("key")
    .innerText =
    "ERRO AO GERAR KEY";

  }

}


/* =========================
   COPIAR KEY
========================= */

document
.getElementById("copyButton")
.onclick =
async function() {

  const key =
  document
  .getElementById("key")
  .innerText;


  if (
    key === "CARREGANDO..." ||
    key === "ERRO AO GERAR KEY"
  ) {

    return;

  }


  try {

    await navigator
    .clipboard
    .writeText(key);


    document
    .getElementById("status")
    .innerText =
    "✅ Key copiada!";


    /*
      COLOQUE AQUI
      A URL DO SEU SITE ANTIGO
    */

    setTimeout(
      function() {

        window.location.href =
        "https://aparecidogustavo299-stack.github.io/Silvaffz-key//";

      },
      1000
    );


  } catch (error) {

    document
    .getElementById("status")
    .innerText =
    "❌ Não foi possível copiar.";

  }

};


/* =========================
   INICIAR
========================= */

criarKey();

</script>

</body>
  </html>
