<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SILVAFFZ - Pegar Key</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top,#101c32,#050811 65%);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    background:#070d19;
    border:1px solid #00eaff;
    border-radius:20px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 0 25px #00eaff44;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#00eaff;
    letter-spacing:2px;
    margin-bottom:8px;
}

.subtitle{
    color:#66849b;
    font-size:13px;
    margin-bottom:25px;
}

.key-box{
    background:#0d1725;
    border:1px solid #00ff88;
    border-radius:12px;
    padding:20px;
}

.key-title{
    color:#00ff88;
    font-size:14px;
    font-weight:bold;
    margin-bottom:15px;
}

#key{
    background:#050811;
    border-radius:8px;
    padding:15px;
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    word-break:break-all;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#00ff88;
    color:#001a0d;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#status{
    min-height:18px;
    margin-top:15px;
    color:#00ff88;
    font-size:12px;
}

#error{
    color:#ff4655;
    font-size:12px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        SILVAFFZ
    </div>

    <div class="subtitle">
        SUA KEY DE ACESSO
    </div>

    <div class="key-box">

        <div class="key-title">
            🔑 SUA KEY
        </div>

        <div id="key">
            VERIFICANDO...
        </div>

        <button id="copyButton">
            📋 COPIAR KEY
        </button>

        <div id="status"></div>

        <div id="error"></div>

    </div>

</div>


<script type="module">

/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


/* =========================
   FIREBASE AUTH
========================= */

import {
    getAuth,
    signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


/* =========================
   FIRESTORE
========================= */

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    Timestamp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =========================
   CONFIGURAÇÃO FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDC7qRhqJJHV4Mybb8DpxMY_Ieud52DeoA",

    authDomain:
    "silvaffz.firebaseapp.com",

    projectId:
    "silvaffz",

    storageBucket:
    "silvaffz.firebasestorage.app",

    messagingSenderId:
    "120628808949",

    appId:
    "1:120628808949:web:745ef77eedbc9550a509bc",

    measurementId:
    "G-D1NJ15L6Q8"

};


/* =========================
   INICIAR FIREBASE
========================= */

const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);


/* =========================
   ELEMENTOS
========================= */

const keyElement =
document.getElementById(
    "key"
);


const copyButton =
document.getElementById(
    "copyButton"
);


const statusElement =
document.getElementById(
    "status"
);


const errorElement =
document.getElementById(
    "error"
);


/* =========================
   GERAR KEY
========================= */

function gerarKey(){

    const parte1 =
    Math.random()
    .toString(36)
    .substring(2,6)
    .toUpperCase();


    const parte2 =
    Math.random()
    .toString(36)
    .substring(2,6)
    .toUpperCase();


    return (
        "SILVA-" +
        parte1 +
        "-" +
        parte2
    );

}


/* =========================
   LOGIN ANÔNIMO
========================= */

async function iniciar(){

    try{

        /*
        Cria ou recupera
        o usuário anônimo.
        */

        const resultado =
        await signInAnonymously(
            auth
        );


        const uid =
        resultado.user.uid;


        console.log(
            "UID anônimo:",
            uid
        );


        /*
        Agora verifica se
        este UID já recebeu
        uma Key.
        */

        await verificarKey(
            uid
        );


    }

    catch(error){

        console.error(
            error
        );


        keyElement.innerText =
        "ERRO";


        errorElement.innerText =
        "Não foi possível conectar ao Firebase.";

    }

}


/* =========================
   VERIFICAR KEY
========================= */

async function verificarKey(
    uid
){

    try{

        /*
        Procura uma Key
        pertencente ao UID.
        */

        const consulta =
        query(

            collection(
                db,
                "Keys"
            ),

            where(
                "uid",
                "==",
                uid
            )

        );


        const resultado =
        await getDocs(
            consulta
        );


        /*
        Se já existe uma Key,
        NÃO cria outra.
        */

        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];


            const dados =
            documento.data();


            keyElement.innerText =
            dados.Key;


            copyButton.style.display =
            "block";


            statusElement.innerText =
            "Sua Key já foi gerada.";


            return;

        }


        /*
        Se não existe,
        cria uma única Key.
        */

        await criarKey(
            uid
        );

    }

    catch(error){

        console.error(
            error
        );


        keyElement.innerText =
        "ERRO";


        errorElement.innerText =
        "Erro ao verificar sua Key.";

    }

}


/* =========================
   CRIAR KEY
========================= */

async function criarKey(
    uid
){

    const key =
    gerarKey();


    const agora =
    new Date();


    const expiracao =
    new Date(
        agora
    );


    expiracao.setDate(
        expiracao.getDate() + 30
    );


    try{

        await addDoc(

            collection(
                db,
                "Keys"
            ),

            {

                Key:
                key,

                uid:
                uid,

                Active:
                true,

                createdAt:
                Timestamp.fromDate(
                    agora
                ),

                expiresAt:
                Timestamp.fromDate(
                    expiracao
                )

            }

        );


        /*
        Mostra a Key criada.
        */

        keyElement.innerText =
        key;


        statusElement.innerText =
        "✅ Sua Key foi criada.";

    }

    catch(error){

        console.error(
            error
        );


        keyElement.innerText =
        "ERRO";


        errorElement.innerText =
        "Não foi possível criar sua Key.";

    }

}


/* =========================
   COPIAR KEY
========================= */

copyButton.onclick =
async function(){

    const key =
    keyElement.innerText;


    if(
        !key ||
        key === "VERIFICANDO..." ||
        key === "ERRO"
    ){

        return;

    }


    try{

        await navigator
        .clipboard
        .writeText(
            key
        );


        statusElement.innerText =
        "✅ Key copiada!";


    }

    catch(error){

        console.error(
            error
        );


        statusElement.innerText =
        "❌ Não foi possível copiar.";

    }

};


/* =========================
   INICIAR SISTEMA
========================= */

copyButton.style.display =
"block";


iniciar();

</script>

</body>

</html>
