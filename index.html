<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SILVAFFZ - Pegar Key</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#101c32,#050811 65%);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    background:#070d19;
    border:1px solid #00eaff;
    border-radius:20px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 0 25px #00eaff44;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#00eaff;
    letter-spacing:2px;
    text-shadow:0 0 15px #00eaff;
    margin-bottom:8px;
}

.subtitle{
    color:#66849b;
    font-size:13px;
    margin-bottom:25px;
}

.key-box{
    background:#0d1725;
    border:1px solid #00ff88;
    border-radius:12px;
    padding:20px;
}

.key-title{
    color:#00ff88;
    font-size:14px;
    font-weight:bold;
    margin-bottom:15px;
}

#key{
    background:#050811;
    border-radius:8px;
    padding:15px;
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    word-break:break-all;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#00ff88;
    color:#001a0d;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#status{
    min-height:18px;
    margin-top:15px;
    color:#00ff88;
    font-size:12px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        SILVAFFZ
    </div>

    <div class="subtitle">
        SUA KEY DE ACESSO
    </div>

    <div class="key-box">

        <div class="key-title">
            🔑 SUA KEY
        </div>

        <div id="key">
            CARREGANDO...
        </div>

        <button id="copyButton">
            📋 COPIAR KEY
        </button>

        <div id="status"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    Timestamp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDC7qRhqJJHV4Mybb8DpxMY_Ieud52DeoA",

    authDomain:
    "silvaffz.firebaseapp.com",

    projectId:
    "silvaffz",

    storageBucket:
    "silvaffz.firebasestorage.app",

    messagingSenderId:
    "120628808949",

    appId:
    "1:120628808949:web:745ef77eedbc9550a509bc",

    measurementId:
    "G-D1NJ15L6Q8"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   GERAR KEY
========================= */

function gerarKey(){

    const parte1 =
    Math.random()
    .toString(36)
    .substring(2,6)
    .toUpperCase();

    const parte2 =
    Math.random()
    .toString(36)
    .substring(2,6)
    .toUpperCase();

    return "SILVA-" +
    parte1 +
    "-" +
    parte2;

}


/* =========================
   CRIAR KEY UMA VEZ
========================= */

async function criarKey(){

    /*
    Verifica se já existe
    uma Key nesta sessão.
    */

    const keyExistente =
    sessionStorage.getItem(
        "silvaffz_key"
    );


    if(keyExistente){

        document
        .getElementById("key")
        .innerText =
        keyExistente;

        return;

    }


    /*
    Cria uma nova Key.
    */

    const key =
    gerarKey();


    const agora =
    new Date();


    const expiracao =
    new Date(agora);


    expiracao.setDate(
        expiracao.getDate() + 30
    );


    try{

        /*
        Salva no Firebase.
        */

        await addDoc(

            collection(
                db,
                "Keys"
            ),

            {

                Key:key,

                Active:true,

                createdAt:
                Timestamp.fromDate(
                    agora
                ),

                expiresAt:
                Timestamp.fromDate(
                    expiracao
                )

            }

        );


        /*
        Salva a mesma Key
        na sessão.
        */

        sessionStorage.setItem(
            "silvaffz_key",
            key
        );


        /*
        Mostra a Key.
        */

        document
        .getElementById("key")
        .innerText =
        key;


    }

    catch(error){

        console.error(error);

        document
        .getElementById("key")
        .innerText =
        "ERRO AO GERAR KEY";

    }

}


/* =========================
   COPIAR KEY
========================= */

document
.getElementById("copyButton")
.onclick =
async function(){

    /*
    Pega a Key que já existe.
    Não cria uma nova.
    */

    const key =
    document
    .getElementById("key")
    .innerText;


    if(
        key === "CARREGANDO..." ||
        key === "ERRO AO GERAR KEY"
    ){

        return;

    }


    try{

        await navigator
        .clipboard
        .writeText(key);


        document
        .getElementById("status")
        .innerText =
        "✅ Key copiada!";


        /*
        Volta para o painel
        depois de 1 segundo.
        */

        setTimeout(
            function(){

                /*
                TROQUE A URL ABAIXO
                PELA URL DO SEU PAINEL
                */

                window.location.href =
                "https://SEU-USUARIO.github.io/SEU-REPOSITORIO/";

            },
            1000
        );


    }

    catch(error){

        console.error(error);

        document
        .getElementById("status")
        .innerText =
        "❌ Não foi possível copiar.";

    }

};


/* =========================
   INICIAR
========================= */

criarKey();

</script>

</body>

  </html>
